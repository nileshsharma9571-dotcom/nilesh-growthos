name: GrowthOS 24x7 Cloud Dispatcher

on:
  schedule:
    # Runs at :17 of every hour from 03:17 UTC to 14:17 UTC (08:47 AM to 07:47 PM IST)
    # Off-peak minute (:17) avoids GitHub :00/:30 queue drops
    - cron: '17 3-14 * * *'
  workflow_dispatch: # High-priority manual/external trigger anytime

permissions:
  contents: write

jobs:
  run-growth-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 24x7 Growth Engine
        env:
          JOB_EMAIL: ${{ secrets.JOB_EMAIL }}
          JOB_APP_PASS: ${{ secrets.JOB_APP_PASS }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          CLIENT_APP_PASS: ${{ secrets.CLIENT_APP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python cloud_growth_engine.py

      - name: Commit Updated Dashboard & Logs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Nilesh Sharma"
          git config --global user.email "nileshsharma9571@gmail.com"
          git add index.html dashboard.html data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily fresh jobs, leads & dashboard [skip ci]" && git push https://x-access-token:${GH_PAT}@github.com/nileshsharma9571-dotcom/nilesh-growthos.git main)
